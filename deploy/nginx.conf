# The site, and the API under /api/. Cloudflare serves HTTPS and connects here; the visitor's address comes from
# CF-Connecting-IP, which is believed only from Cloudflare's own ranges (cloudflare.conf, made when the image is built).
real_ip_header CF-Connecting-IP;

server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  client_max_body_size 100m;
  # Docker's DNS, asked again every few seconds, so a recreated API container is found.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://server:47110;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    # Live updates (server-sent events) and sign-in packages stream straight through.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
}
