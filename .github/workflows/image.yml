# Astro check on every push and pull request; the image goes to GHCR (ghcr.io/<owner>/folio-site) from main
# (tag "main") and from version tags (tags "v1.2.3" and "latest"). The end-to-end tests need a running folio-server
# and a mail inbox, so they run on the development machine before each release.
#
# Repository variables: FOLIO_URL, the site's public address (e.g. https://folio.example.com); DESKTOP_REPO, the
# public desktop repository whose latest release has the installers (e.g. your-name/folio-desktop).
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: FOLIO_URL and DESKTOP_REPO are set
        env:
          FOLIO_URL: ${{ vars.FOLIO_URL }}
          DESKTOP_REPO: ${{ vars.DESKTOP_REPO }}
        run: |
          case "$FOLIO_URL" in https://*) ;; *) echo "::error::Set the repository variable FOLIO_URL (e.g. https://folio.example.com)"; exit 1;; esac
          case "$DESKTOP_REPO" in */*) ;; *) echo "::error::Set the repository variable DESKTOP_REPO (e.g. your-name/folio-desktop)"; exit 1;; esac
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/folio-site
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.FOLIO_URL }}
            PUBLIC_DESKTOP_REPO=${{ vars.DESKTOP_REPO }}
